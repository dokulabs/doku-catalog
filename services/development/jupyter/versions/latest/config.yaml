version: latest
image: jupyter/base-notebook:latest
description: Jupyter Notebook - Interactive computing environment
port: 8888
protocol: http
volumes:
  - /home/jovyan/work
environment:
  JUPYTER_ENABLE_LAB: "yes"
  JUPYTER_TOKEN: doku
healthcheck:
  test:
    - CMD-SHELL
    - curl -f http://localhost:8888/api || exit 1
  interval: 10s
  timeout: 5s
  retries: 5
  start: 15s
resources:
  memory_min: 256m
  memory_max: 2g
  cpu_min: "0.25"
  cpu_max: "2.0"
